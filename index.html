<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Links -->
  <link rel="icon" href="./favicons/favicon-16x16.png">
  <link rel="stylesheet" href="./css/style.css">

  <title>Pokédex</title>
</head>
<body>
  <main>
    <img src="#" alt="pokemon" class="ImagemPokemon">

    <h1 class="DadosPokemon">
      <span class="Numero"></span>
      <span class="Nome"></span>
    </h1>

    <form class="form">
      <input type="search" class="Pesquisar" placeholder="Nome ou número do Pokémon" required/>
    </form>

    <div class="botoes">
      <button class="botao btn-Ant">Anterior &lt;</button>
      <button class="botao btn-Prox">Próximo &gt;</button>
    </div>

    <img src="./images/pokedex.png" alt="pokedex" class="pokedex">
  </main>

</body>
</html>
